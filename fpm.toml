name = "fortfem"
version = "0.1.0"
license = "license"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025, Christopher Albert"
description = "A modern Fortran finite element library designed for ease of use, inspired by FreeFEM and FEniCS"
homepage = "https://github.com/lazy-fortran/fortfem"
keywords = ["finite-elements", "pde", "scientific-computing", "fortran", "fem"]
categories = ["science"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["lapack"]

[install]
library = true
test = false

[library]
source-dir = "src"
include-dir = "include"

[[executable]]
name = "benchmark_tetra_vector_interpolation_ad"
source-dir = "benchmark"
main = "fortfem_tetra_vector_interpolation_ad.f90"

[[executable]]
name = "fortfem_csr_spmv_scaling"
source-dir = "benchmark"
main = "fortfem_csr_spmv_scaling.f90"

[[executable]]
name = "fortfem_dg_curved_scaling"
source-dir = "benchmark"
main = "fortfem_dg_curved_scaling.f90"

[[executable]]
name = "fortfem_fourier_apply_bench"
source-dir = "benchmark"
main = "fortfem_fourier_apply_bench.f90"

[[executable]]
name = "fortfem_toroidal_mode_bem_scaling"
source-dir = "benchmark"
main = "fortfem_toroidal_mode_bem_scaling.f90"

[[executable]]
name = "fortfem_element_precision_scaling"
source-dir = "benchmark"
main = "fortfem_element_precision_scaling.f90"

[[executable]]
name = "bem_residual_study"
source-dir = "benchmark"
main = "bem_residual_study.f90"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[executable]]
name = "fortfem_bem_shared_edge_diagnostic"
source-dir = "benchmark"
main = "fortfem_bem_shared_edge_diagnostic.f90"

[extra.ford]
project = "FortFEM"
summary = "A modern Fortran finite element library"
version = "0.1.0"
email = "albert@tugraz.at"
github = "https://github.com/lazy-fortran/fortfem"
website = "https://lazy-fortran.github.io/fortfem/"
license = "MIT"
src_dir = "src"
output_dir = "build/doc"
page_dir = "doc"
graph_maxnodes = 32
graph_maxdepth = 4
source = true
proc_internals = true
sort = "permission-alpha"
print_creation_date = true
creation_date = "%Y-%m-%d %H:%M %z"
css = "doc/fortfem.css"
md_extensions = ["markdown.extensions.toc", "markdown.extensions.smarty", "markdown.extensions.fenced_code", "markdown.extensions.codehilite"]

[dependencies]
blas = "*"
fortplot = { git = "https://github.com/lazy-fortran/fortplot.git" }
fortnum = { git = "https://github.com/lazy-fortran/fortnum.git", rev = "1cfe3cba327e9a32743ed10292e75a1311a6ced4" }
fortsparse = { git = "https://github.com/lazy-fortran/fortsparse.git", rev = "7f16e38aaf5ebdfa56b0b8b4f5f57c0c31de212c" }

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive.git" }
