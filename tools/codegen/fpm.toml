name = "fortfem_codegen"
version = "0.1.0"
license = "MIT"

[dependencies]
fortsym = { path = "../../../fortsym" }

[build]
auto-executables = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[executable]]
name = "gen_tetra_nedelec_candidates"
source-dir = "app"
main = "gen_tetra_nedelec_candidates.f90"

[[executable]]
name = "gen_tetra_face_moment_transforms"
source-dir = "app"
main = "gen_tetra_face_moment_transforms.f90"

[[executable]]
name = "gen_tetra_nedelec_coefficients"
source-dir = "app"
main = "gen_tetra_nedelec_coefficients.f90"

[[executable]]
name = "gen_tetra_rt_candidates"
source-dir = "app"
main = "gen_tetra_rt_candidates.f90"

[[executable]]
name = "gen_tetra_rt_coefficients"
source-dir = "app"
main = "gen_tetra_rt_coefficients.f90"

[[executable]]
name = "gen_toroidal_coordinates"
source-dir = "app"
main = "gen_toroidal_coordinates.f90"

[[executable]]
name = "gen_interoperability_oracles"
source-dir = "app"
main = "gen_interoperability_oracles.f90"

[[executable]]
name = "gen_tetra_h1_oracle"
source-dir = "app"
main = "gen_tetra_h1_oracle.f90"
