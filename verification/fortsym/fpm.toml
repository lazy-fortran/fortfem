name = "fortfem-symbolic-verification"
version = "0.1.0"
license = "MIT"

[build]
auto-executables = true
auto-tests = false
auto-examples = false
link = ["symengine", "flint", "mpfr", "gmp", "stdc++", "dl"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fortsym = { git = "https://github.com/lazy-fortran/fortsym.git", rev = "85ac876395bc7d875142aa2bd38a06df8c3e6e4b" }

[[executable]]
name = "verify_polar_complex"
source-dir = "app"
main = "verify_polar_complex.f90"
