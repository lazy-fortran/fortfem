name: Deploy Documentation to GitHub Pages

on:
  # Generate the physical gallery from the exact commit being published.
  push:
    branches: [main]
  workflow_dispatch:

env:
  OMP_NUM_THREADS: 2
  OPENBLAS_NUM_THREADS: 1
  MPLBACKEND: Agg

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: [self-hosted, itp-ubuntu24]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl gfortran liblapack-dev libsuitesparse-dev make python3-venv
          mkdir -p "$RUNNER_TEMP/fortfem-bin"
          curl -fsSL -o "$RUNNER_TEMP/fortfem-bin/fpm" \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          chmod +x "$RUNNER_TEMP/fortfem-bin/fpm"
          echo "$RUNNER_TEMP/fortfem-bin" >> "$GITHUB_PATH"
          # Ford's search-index builder uses BeautifulSoup's lxml parser;
          # install it explicitly so a clean runner does not fall back to the
          # much slower pure-Python parser for this large generated API.
          python3 -m venv "$RUNNER_TEMP/fortfem-docs-venv"
          "$RUNNER_TEMP/fortfem-docs-venv/bin/pip" install ford lxml
          echo "$RUNNER_TEMP/fortfem-docs-venv/bin" >> "$GITHUB_PATH"

      - name: Generate physical primary plots
        run: |
          bash test/test_primary_plot_generation.sh
          bash test/test_interoperability_primary_plot.sh
          bash scripts/generate_primary_plots.sh
        
      - name: Generate example documentation pages
        run: |
          chmod +x scripts/generate_example_docs.sh
          ./scripts/generate_example_docs.sh
          bash test/test_example_docs.sh
          bash test/test_gallery_media_staging.sh
        
      - name: Build documentation
        run: make doc

      - name: Stage and validate generated gallery media
        run: |
          set -euo pipefail
          source_dir=artifacts/plots/examples
          test -d "$source_dir"
          test "$(find "$source_dir" -name '*.png' | wc -l)" -gt 0
          test -s "$source_dir/interoperability_benchmarks/primary.png"
          chmod +x scripts/stage_gallery_media.sh
          scripts/stage_gallery_media.sh \
            "$source_dir" build/doc/page/media/examples
          scripts/stage_gallery_media.sh \
            "$source_dir" build/doc/media/examples

      - name: Validate complete examples page
        run: bash test/test_example_pages.sh
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the documentation directory
          path: './build/doc'
          retention-days: 1
          
  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, itp-ubuntu24]
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
