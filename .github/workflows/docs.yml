name: Deploy Documentation to GitHub Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Completed test run ID whose generated-plots artifact should be reused"
        required: false
        type: string
  
  # Run after test/interoperability workflows complete.  The test workflow
  # deliberately publishes example artifacts even when verification failures
  # keep its conclusion red.
  workflow_run:
    workflows: ["test", "interoperability"]
    types:
      - completed
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download example plots from triggering test run
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'test' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: generated-plots
          path: ./artifacts/plots/
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Download example plots from selected test run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ inputs.artifact_run_id }}
          name: generated-plots
          path: ./artifacts/plots/
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Download latest successful example plots
        if: ${{ (github.event_name != 'workflow_run' && inputs.artifact_run_id == '') || (github.event_name == 'workflow_run' && github.event.workflow_run.name != 'test') }}
        uses: dawidd6/action-download-artifact@v3
        with:
          name: generated-plots
          path: ./artifacts/plots/
          workflow: test.yml
          branch: main
          workflow_conclusion: success
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Download latest interoperability plots
        uses: dawidd6/action-download-artifact@v3
        with:
          name: generated-interoperability-plots-.*
          name_is_regexp: true
          path: ./artifacts/plots/examples/interoperability_benchmarks/
          workflow: interoperability.yml
          branch: main
          workflow_conclusion: success
          if_no_artifact_found: ignore
        continue-on-error: true
        
      - name: Create empty plots directory if no artifacts
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/plots/
          interoperability_dir=./artifacts/plots/examples/interoperability_benchmarks
          if [[ -d "$interoperability_dir" ]]; then
            shopt -s nullglob
            nested=("$interoperability_dir"/generated-interoperability-plots-*)
            if [[ "${#nested[@]}" -gt 0 ]]; then
              test "${#nested[@]}" -eq 1
              find "${nested[0]}" -maxdepth 1 -type f \
                -exec mv {} "$interoperability_dir/" \;
              rmdir "${nested[0]}"
            fi
          fi
          find ./artifacts/plots/ -maxdepth 4 -type f -print
        
      - name: Install dependencies
        run: |
          # Ford's search-index builder uses BeautifulSoup's lxml parser;
          # install it explicitly so a clean runner does not fall back to the
          # much slower pure-Python parser for this large generated API.
          pip install ford lxml
        
      - name: Generate example documentation pages
        run: |
          chmod +x scripts/generate_example_docs.sh
          ./scripts/generate_example_docs.sh
          bash test/test_example_docs.sh
          bash test/test_gallery_media_staging.sh
        
      - name: Build documentation
        run: make doc

      - name: Stage and validate generated gallery media
        run: |
          set -euo pipefail
          source_dir=artifacts/plots/examples
          test -d "$source_dir"
          test "$(find "$source_dir" -name '*.png' | wc -l)" -gt 0
          test "$(find "$source_dir/interoperability_benchmarks" \
            -maxdepth 1 -name '*.png' | wc -l)" -ge 5
          test -s "$source_dir/interoperability_benchmarks/primary.png"
          chmod +x scripts/stage_gallery_media.sh
          scripts/stage_gallery_media.sh \
            "$source_dir" build/doc/page/media/examples
          scripts/stage_gallery_media.sh \
            "$source_dir" build/doc/media/examples

      - name: Validate complete examples page
        run: bash test/test_example_pages.sh
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the documentation directory
          path: './build/doc'
          
  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
