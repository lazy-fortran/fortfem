name: Deploy Documentation to GitHub Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Run after test workflow completes successfully
  workflow_run:
    workflows: ["test", "interoperability"]
    types:
      - completed
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download latest example plots
        uses: dawidd6/action-download-artifact@v3
        with:
          name: generated-plots
          path: ./artifacts/plots/
          workflow: test.yml
          branch: main
          workflow_conclusion: success
          if_no_artifact_found: ignore
        continue-on-error: true
        if: github.event_name == 'workflow_run'

      - name: Download latest interoperability plots
        uses: dawidd6/action-download-artifact@v3
        with:
          name: generated-interoperability-plots-.*
          name_is_regexp: true
          path: ./artifacts/plots/examples/interoperability_benchmarks/
          workflow: interoperability.yml
          branch: main
          workflow_conclusion: success
          if_no_artifact_found: ignore
        continue-on-error: true
        if: github.event_name == 'workflow_run'
        
      - name: Create empty plots directory if no artifacts
        run: |
          mkdir -p ./artifacts/plots/
          find ./artifacts/plots/ -maxdepth 4 -type f -print
        
      - name: Install dependencies
        run: |
          pip install ford
        
      - name: Generate example documentation pages
        run: |
          chmod +x scripts/generate_example_docs.sh
          ./scripts/generate_example_docs.sh
        
      - name: Build documentation
        run: make doc

      - name: Stage and validate generated gallery media
        run: |
          set -euo pipefail
          source_dir=artifacts/plots/examples
          test -d "$source_dir"
          test "$(find "$source_dir" -name '*.png' | wc -l)" -gt 0
          mkdir -p build/doc/page/media/examples build/doc/media/examples
          cp -r "$source_dir"/. build/doc/page/media/examples/
          cp -r "$source_dir"/. build/doc/media/examples/
          while IFS= read -r source; do
            relative=${source#"$source_dir"/}
            test -s "build/doc/page/media/examples/$relative"
            test -s "build/doc/media/examples/$relative"
          done < <(find "$source_dir" -type f)
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the documentation directory
          path: './build/doc'
          
  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
