name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: generated sources are current
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake \
          g++ \
          gfortran \
          libflint-dev \
          libgmp-dev \
          libmpfr-dev \
          ninja-build

    - name: Install pinned SymEngine
      run: scripts/ci/install_symengine.sh

    - name: Install fpm and fo
      run: |
        sudo curl -L -o /usr/local/bin/fpm \
          https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
        sudo chmod +x /usr/local/bin/fpm
        git clone --depth 1 https://github.com/lazy-fortran/fo.git /tmp/fo
        (
          cd /tmp/fo
          fpm install --profile release --prefix "$HOME/.local"
        )
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Checkout locked fortsym revision
      run: |
        git clone https://github.com/lazy-fortran/fortsym.git ../fortsym
        git -C ../fortsym checkout "$(cat tools/codegen/fortsym.lock)"

    - name: Check generated sources
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        tools/codegen/check_generated.sh

    - name: Prove polar-complex identities with FortSym
      working-directory: verification/fortsym
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        fo exec verify_polar_complex

  build-test:
    runs-on: ${{ matrix.os }}
    env:
      # Keep the ten-second per-target contract reliable on large runners;
      # unconstrained host-wide parallelism makes independent numerical tests
      # contend for memory and spuriously cross the wall-clock limit.
      FO_JOBS: 8
      FO_TEST_TIMEOUT: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran liblapack-dev libsuitesparse-dev \
          libsuperlu-dev

    - name: Setup Fortran Package Manager
      run: |
        wget https://github.com/fortran-lang/fpm/releases/download/v0.12.0/fpm-0.12.0-linux-x86_64-gcc-12
        chmod +x fpm-0.12.0-linux-x86_64-gcc-12
        sudo mv fpm-0.12.0-linux-x86_64-gcc-12 /usr/local/bin/fpm

    - name: Install fo test runner
      run: |
        git clone --depth 1 https://github.com/lazy-fortran/fo.git /tmp/fo
        (
          cd /tmp/fo
          fpm install --profile release --prefix "$HOME/.local"
        )
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build
      run: fpm build --profile release

    - name: Set up uv for the external IGA oracle
      uses: astral-sh/setup-uv@v6

    - name: Verify IGA operators against Nutils
      run: |
        uv run --with nutils==9.2 \
          python test/reference/nutils_iga_oracle.py

    - name: Run tests
      id: unit_tests
      continue-on-error: true
      run: fo test

    - name: Run tests with coverage
      id: coverage
      continue-on-error: true
      run: |
        fo test --flag "--coverage"
        find build -name "*.gcda" -type f -exec dirname {} \; | sort -u | while read -r dir; do
          gcov -o "$dir" src/*.f90 || true
        done

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./*.gcov
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Build examples
      id: build_examples
      continue-on-error: true
      run: |
        fpm build --example

    - name: Run all examples
      id: examples
      continue-on-error: true
      run: |
        set -euo pipefail
        echo "Running all examples..."
        mapfile -t example_sources < <(
          find example -mindepth 1 -maxdepth 2 -type f -name '*.f90' | sort
        )
        for example_source in "${example_sources[@]}"; do
          example_name=$(basename "$example_source" .f90)
          if [[ "$example_name" == "interoperability_benchmarks" ]]; then
            echo "Skipping $example_name: external solver artifacts required"
            continue
          fi
          echo "Running example: $example_name"
          fpm run --example "$example_name"
          mkdir -p "output/example/$example_name"
          find . -maxdepth 1 -type f -name '*.png' \
            -exec mv {} "output/example/$example_name/" \;
        done

    - name: Run all benchmarks  
      id: benchmarks
      continue-on-error: true
      run: |
        echo "Running FortFEM benchmarks..."
        fpm run --example plotting || echo "Plotting demo completed"
        
        echo "Running convergence benchmarks..."
        fpm test run_convergence_tests || echo "Convergence tests completed"

    - name: Collect generated plots
      if: always()
      run: |
        set -euo pipefail
        mkdir -p ci-artifacts/plots/examples

        # Preserve the producing example in the artifact path so equally named
        # plots cannot overwrite one another and gallery ownership is exact.
        if [[ -d output/example ]]; then
          cp -r output/example/. ci-artifacts/plots/examples/
        fi

        total_plots=$(find ci-artifacts/plots/ -name "*.png" | wc -l)
        if [ "$total_plots" -eq 0 ]; then
          echo "::error::No generated plots were collected"
          exit 1
        fi

    - name: Upload plot artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: generated-plots
        path: ci-artifacts/plots/
        retention-days: 30

    - name: Report verification failures after publishing artifacts
      if: always() && (steps.unit_tests.outcome == 'failure' || steps.coverage.outcome == 'failure' || steps.build_examples.outcome == 'failure' || steps.examples.outcome == 'failure' || steps.benchmarks.outcome == 'failure')
      run: |
        echo "One or more verification stages failed; generated artifacts were uploaded for documentation."
        exit 1

  enzyme:
    name: released Flang 22 + pinned Enzyme
    runs-on: ubuntu-24.04
    env:
      LLVM_MAJOR: "22"
      ENZYME_REVISION: c96508349d9f121957292308c646b4a1fd53c507
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates cmake curl g++ gfortran git gnupg \
          libblas-dev liblapack-dev libsuitesparse-dev libsuperlu-dev \
          lsb-release ninja-build software-properties-common

    - name: Install released LLVM and Flang
      run: |
        curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
        chmod +x /tmp/llvm.sh
        sudo /tmp/llvm.sh "$LLVM_MAJOR"
        sudo apt-get install -y --no-install-recommends \
          "flang-$LLVM_MAJOR" \
          "libclang-$LLVM_MAJOR-dev" \
          "llvm-$LLVM_MAJOR-dev"
        mkdir -p "$RUNNER_TEMP/llvm-bin"
        for tool in clang flang-new llvm-link opt; do
          ln -s "/usr/bin/$tool-$LLVM_MAJOR" "$RUNNER_TEMP/llvm-bin/$tool"
        done
        echo "$RUNNER_TEMP/llvm-bin" >> "$GITHUB_PATH"

    - name: Build pinned Enzyme plugin
      run: |
        git clone https://github.com/EnzymeAD/Enzyme.git "$RUNNER_TEMP/enzyme"
        git -C "$RUNNER_TEMP/enzyme" checkout "$ENZYME_REVISION"
        cmake -S "$RUNNER_TEMP/enzyme/enzyme" \
          -B "$RUNNER_TEMP/enzyme-build" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR="/usr/lib/llvm-$LLVM_MAJOR/lib/cmake/llvm"
        cmake --build "$RUNNER_TEMP/enzyme-build" \
          --target "LLVMEnzyme-$LLVM_MAJOR" -j 2
        echo "FORTFEM_CI_ENZYME_PLUGIN=$RUNNER_TEMP/enzyme-build/Enzyme/LLVMEnzyme-$LLVM_MAJOR.so" \
          >> "$GITHUB_ENV"

    - name: Configure required Enzyme tournament
      run: |
        cmake -S . -B build-enzyme -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DFORTFEM_ENABLE_ENZYME=ON \
          -DFORTFEM_ENZYME_REQUIRED=ON \
          -DFORTNUM_ENZYME_PLUGIN="$FORTFEM_CI_ENZYME_PLUGIN"

    - name: Build and test real Enzyme products
      run: |
        cmake --build build-enzyme \
          --target fortfem_enzyme_h1_geometry_products_build -j 2
        ctest --test-dir build-enzyme --output-on-failure -R fortfem_enzyme

  # Summary job for branch protection - must be named 'test' for PR checks
  test:
    name: test
    needs: [build-test, enzyme, generated]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          echo "Build-test result: ${{ needs.build-test.result }}"
          echo "Enzyme result: ${{ needs.enzyme.result }}"
          echo "Generated-source result: ${{ needs.generated.result }}"
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "::error::Tests failed"
            exit 1
          fi
          if [ "${{ needs.generated.result }}" != "success" ]; then
            echo "::error::Generated sources are stale"
            exit 1
          fi
          if [ "${{ needs.enzyme.result }}" != "success" ]; then
            echo "::error::Enzyme tests failed"
            exit 1
          fi
          echo "All tests passed"
